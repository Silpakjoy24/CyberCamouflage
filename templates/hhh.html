{% extends 'adminpages/aindex.html' %}
{% block body %}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center">File upload</h2>
                <form action="/myapp/file_upload_post/" method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="username">File</label>
                        <input type="file" class="form-control" name="file" id="username" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">upload</button>
                </form>
                {% for i in messages %}

                    <span style="color: #0a0a0a">{{ i }}</span>

                {% endfor %}

            </div>
        </div>
    </div>
