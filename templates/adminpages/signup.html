<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    :root {
        --terminal-green: #10b981;
        --terminal-cyan: #06b6d4;
        --terminal-bg: #05070a;
        --panel-bg: #0a0c10;
        --border-low: rgba(16, 185, 129, 0.2);
    }

    body, html, .main-panel, .content-wrapper, .container-scroller {
        background-color: #000 !important;
        color: var(--terminal-green) !important;
        font-family: 'Segoe UI', 'Courier New', monospace;
    }

    /* --- TERMINAL CHASSIS --- */
    .tactical-container {
        max-width: 850px;
        margin: 40px auto;
        background: var(--panel-bg);
        border: 1px solid var(--border-low);
        position: relative;
        padding: 60px 50px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    /* Industrial Corner Accents */
    .tactical-container::before, .tactical-container::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        border: 2px solid var(--terminal-green);
    }
    .tactical-container::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
    .tactical-container::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

    /* --- SECTION HEADERS --- */
    .form-section-tag {
        font-size: 10px;
        letter-spacing: 3px;
        color: var(--terminal-cyan);
        text-transform: uppercase;
        border-bottom: 1px solid var(--border-low);
        margin-bottom: 25px;
        padding-bottom: 5px;
        display: flex;
        justify-content: space-between;
    }

    /* --- INPUT STYLING --- */
    .cyber-field-wrapper {
        position: relative;
        margin-bottom: 5px;
    }

    .cyber-input {
        background: rgba(0,0,0,0.4) !important;
        border: 1px solid var(--border-low) !important;
        color: #fff !important;
        border-radius: 0 !important;
        padding: 12px 15px;
        font-size: 0.9rem;
        transition: all 0.3s ease;
    }

    .cyber-input:focus {
        background: rgba(16, 185, 129, 0.05) !important;
        border-color: var(--terminal-green) !important;
        box-shadow: 0 0 15px rgba(16, 185, 129, 0.1) !important;
        outline: none;
    }

    .cyber-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--terminal-cyan);
        margin-bottom: 8px;
        display: block;
    }

    /* --- RADIO BUTTONS --- */
    .form-check-input {
        cursor: pointer;
        background-color: transparent !important;
        border: 1px solid var(--terminal-green) !important;
    }
    .form-check-input:checked {
        background-color: var(--terminal-green) !important;
    }

    /* --- FILE UPLOAD BUTTON --- */
    .cyber-input[type="file"]::file-selector-button {
        background: var(--terminal-green);
        color: #000;
        border: none;
        padding: 5px 15px;
        margin-right: 15px;
        text-transform: uppercase;
        font-weight: bold;
        font-size: 0.7rem;
        cursor: pointer;
    }

    /* --- SUBMIT BUTTON --- */
    .btn-deploy {
        background: transparent;
        border: 1px solid var(--terminal-green);
        color: var(--terminal-green);
        padding: 15px;
        width: 100%;
        text-transform: uppercase;
        letter-spacing: 4px;
        font-weight: 900;
        margin-top: 30px;
        transition: 0.3s;
        clip-path: polygon(5% 0, 100% 0, 100% 70%, 95% 100%, 0 100%, 0% 30%);
    }

    .btn-deploy:hover {
        background: var(--terminal-green);
        color: #000;
        box-shadow: 0 0 30px var(--terminal-green);
    }

    /* --- TOP DECORATION --- */
    .terminal-status-bar {
        position: absolute;
        top: 15px;
        right: 50px;
        left: 50px;
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        font-family: monospace;
        opacity: 0.6;
    }
</style>
</head>
<body>
<div class="container-fluid py-5">
    <div class="tactical-container">
        <div class="terminal-status-bar">
            <span>CORE_OS: V2.0.45</span>
            <span class="text-white">// ACCESS_POINT: SECTOR_7 //</span>
            <span id="digital-clock">TIMESTAMP: 13:42:01</span>
        </div>

        <div class="text-center mb-5 mt-3">
            <h2 class="text-white fw-bold m-0" style="letter-spacing: 10px; text-transform: uppercase;">Registration</h2>
            <div style="font-size: 9px; color: var(--terminal-green);">SYSTEM_STATE: READY_FOR_INPUT</div>
        </div>
    <form action="/myapp/signup_post/" method="post" enctype="multipart/form-data">
        {% csrf_token %}
<div class="form-section-tag">
                <span>01. PRIMARY_IDENTITY</span>
                <span>[MANDATORY]</span>
            </div>
            <div class="row g-4 mb-5">
                <div class="col-md-8">
                    <label class="cyber-label">Legal Name String</label>
                    <div class="cyber-field-wrapper">
                        <input type="text" name="name" class="form-control cyber-input" placeholder="Full Name" required>
                    </div>
                </div>
                <div class="col-md-4">
                    <label class="cyber-label">Biometric Gender</label>
                    <div class="d-flex gap-3 pt-2">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="gender" value="male" id="male" checked>
                            <label class="form-check-label text-white small" for="male">M</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                            <label class="form-check-label text-white small" for="female">F</label>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="cyber-label">Date of Origin (DOB)</label>
                    <input type="date" name="dob" class="form-control cyber-input" required>
                </div>
                <div class="col-md-6">
                    <label class="cyber-label">Visual ID Reference (Photo)</label>
                    <input type="file" name="photo" class="form-control cyber-input" accept="image/*" required>
                </div>
            </div>

            <div class="form-section-tag">
                <span>02. NETWORK_LOCATION</span>
                <span>[SECURE_COMMS]</span>
            </div>
            <div class="row g-4 mb-5">
                <div class="col-md-6">
                    <label class="cyber-label">Communication Node (Email)</label>
                    <input type="email" name="email" class="form-control cyber-input" placeholder="node@network.com" required>
                </div>
                <div class="col-md-6">
                    <label class="cyber-label">Mobile Uplink (Phone)</label>
                    <input type="tel" name="phone" pattern="[0-9]{10}" class="form-control cyber-input" placeholder="XXXXXXXXXX" required>
                </div>
                <div class="col-md-4">
                    <label class="cyber-label">Grid Place</label>
                    <input type="text" name="place" class="form-control cyber-input" required>
                </div>
                <div class="col-md-3">
                    <label class="cyber-label">District ID</label>
                    <input type="text" name="district" class="form-control cyber-input" placeholder="Enter District" required>
                </div>
                <div class="col-md-4">
                    <label class="cyber-label">City</label>
                    <input type="text" name="city" class="form-control cyber-input" required>
                </div>
                <div class="col-md-4">
                    <label class="cyber-label">Area Code</label>
                    <input type="text" name="pincode" pattern="[0-9]{6}" class="form-control cyber-input" placeholder="6-Digits" required>
                </div>
                <div class="col-md-12">
                    <label class="cyber-label">Region State</label>
                    <input type="text" name="state" class="form-control cyber-input" required>
                </div>
            </div>

            <div class="form-section-tag">
                <span>03. ACCESS_CRYPTOGRAPHY</span>
                <span>[LEVEL_3_ENCRYPTION]</span>
            </div>
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="cyber-label">Define Access Key</label>
                    <input type="password" name="password" class="form-control cyber-input" placeholder="Min 6 Characters" minlength="6" required>
                </div>
                <div class="col-md-6">
                    <label class="cyber-label">Verify Access Key</label>
                    <input type="password" name="confirmPassword" class="form-control cyber-input" placeholder="Re-enter Key" required>
                </div>
            </div>

            <button type="submit" class="btn-deploy">
                Submit_Data_to_Central_Core
            </button>
        </form>
    </div>
</div>
  <script>
    // Live Clock Script for extra professionalism
    function updateClock() {
        const now = new Date();
        const time = now.getHours().toString().padStart(2, '0') + ":" +
                     now.getMinutes().toString().padStart(2, '0') + ":" +
                     now.getSeconds().toString().padStart(2, '0');
        document.getElementById('digital-clock').innerText = "TIMESTAMP: " + time;
    }
    setInterval(updateClock, 1000);
</script>
</body>
</html>
