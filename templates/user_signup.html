<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"></script>

  <div class="container p-4 d-flex justify-content-center align-items-center">
    <div class="card p-4 shadow" style="border-radius: 1rem; width: 100%; max-width: 600px;">
      <h2 class="text-center mb-4">REGISTRATION</h2>
      <form>
        <div class="mb-3">
          <label for="name" class="form-label">Name:</label>
          <input type="text" class="form-control" id="name" name="name" placeholder="Enter name here">
        </div>
          <div class="mb-3">
          <label for="dob" class="form-label">date of birth:</label>
          <input type="date" class="form-control" id="dob" name="dob" placeholder="Enter date of birth here">
        </div>
          <div class="mb-3">
          <label class="form-label">Gender:</label><br>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="gender" id="male" value="Male">
            <label class="form-check-label" for="male">Male</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="gender" id="female" value="Female">
            <label class="form-check-label" for="female">Female</label>
          </div>
          <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="gender" id="other" value="Other">
            <label class="form-check-label" for="other">Other</label>
          </div>
        </div>
          <div class="mb-3">
          <label for="email" class="form-label">E-mail:</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="Enter email here">
        </div>
          <div class="mb-3">
          <label for="phone" class="form-label">Phone:</label>
          <input type="tel" class="form-control" id="phone" name="phone" placeholder="Enter phone here">
        </div>
          <div class="mb-3">
  <label for="photo" class="form-label">Upload Photo:</label>
  <input class="form-control" type="file" id="photo" name="photo" accept="image/*" required>
</div>


        <div class="mb-3">
          <label for="place" class="form-label">Place:</label>
          <input type="text" class="form-control" id="place" name="place" placeholder="Enter place here">
        </div>
          <div class="mb-3">
          <label for="state" class="form-label">state:</label>
          <input type="text" class="form-control" id="state" name="state" placeholder="Enter state here">
        </div><div class="mb-3">
          <label for="dis" class="form-label">district:</label>
          <input type="text" class="form-control" id="dis" name="dis" placeholder="Enter district here">
        </div>
          <div class="mb-3">
          <label for="pin" class="form-label">Pin:</label>
          <input type="text" class="form-control" id="pin" name="pin" placeholder="Enter pin here">
        </div>


        <div class="text-center">
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>
      </form>
    </div>
  </div>
<script>
    document.getElementById("regForm").addEventListener("submit", function(e){
      e.preventDefault();


      localStorage.setItem("name", document.getElementById("name").value);
      localStorage.setItem("dob", document.getElementById("dob").value);
      localStorage.setItem("gender", document.querySelector('input[name="gender"]:checked').value);
      localStorage.setItem("email", document.getElementById("email").value);
      localStorage.setItem("phone", document.getElementById("phone").value);
      localStorage.setItem("place", document.getElementById("place").value);
      localStorage.setItem("state", document.getElementById("state").value);
      localStorage.setItem("district", document.getElementById("district").value);
      localStorage.setItem("pin", document.getElementById("pin").value);

      const file = document.getElementById("photo").files[0];
      if(file){
        const reader = new FileReader();
        reader.onload = function(){
          localStorage.setItem("photo", reader.result);
          window.location.href = "profile.html";
        }
        reader.readAsDataURL(file);
      } else {
        window.location.href = "profile.html";
      }
    });
  </script>
</body>
</html>
